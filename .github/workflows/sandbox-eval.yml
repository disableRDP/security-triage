name: sandbox-eval

# Evaluation of dynamic (sandboxed) execution for a possible v2. Runs only on
# the evaluation branch and on demand, never as part of master's CI.
# Every sample is a harmless canary: it touches only fake credential files and
# 198.51.100.7 (TEST-NET-2, RFC 5737, never routable).
on:
  push:
    branches: [sandbox-eval]
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          docker version --format 'docker server {{.Server.Version}}'
          uname -r
          cat /proc/sys/kernel/yama/ptrace_scope || true

      - name: Build sandbox image
        run: |
          SECONDS=0
          docker build -t triage-sandbox -f evals/sandbox/image/Dockerfile evals/sandbox
          echo "image build: ${SECONDS}s"

      # A: plain docker run, tracer and script share a user, output dir writable by it.
      - name: Plain docker run - naive (tracer and script share a user)
        run: |
          SECONDS=0
          for s in evals/sandbox/samples/*/; do
            name="$(basename "$s")"; out="/tmp/plain-naive/$name"
            mkdir -p "$out"; chmod 777 "$out"
            docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
              --pids-limit 128 --memory 512m --cpus 1 \
              -v "$PWD/$s:/skill:ro" -v "$out:/out" \
              triage-sandbox /monitor/run_under_strace.sh /skill /out 20 > /dev/null
          done
          echo "naive: ${SECONDS}s for $(ls evals/sandbox/samples | wc -l) samples"
          python evals/sandbox/report.py plain /tmp/plain-naive

      # B: tracer runs as root and only the script drops to the sandbox user, so the
      # script cannot touch the trace. Root filesystem read-only, capabilities minimal.
      - name: Plain docker run - hardened (tracer isolated from the script)
        run: |
          SECONDS=0
          for s in evals/sandbox/samples/*/; do
            name="$(basename "$s")"; out="/tmp/plain-hard/$name"
            sudo install -d -o root -g root -m 755 "$out"
            docker run --rm --network none --user 0 \
              --cap-drop ALL --cap-add SETUID --cap-add SETGID --cap-add SYS_PTRACE \
              --security-opt no-new-privileges --read-only \
              --tmpfs /tmp:rw,mode=1777 --tmpfs /workspace:rw,mode=1777 \
              --pids-limit 128 --memory 512m --cpus 1 -e RUN_AS=sandbox \
              -v "$PWD/$s:/skill:ro" -v "$out:/out" \
              triage-sandbox /monitor/run_under_strace.sh /skill /out 20 > /dev/null
          done
          echo "hardened: ${SECONDS}s for $(ls evals/sandbox/samples | wc -l) samples"
          python evals/sandbox/report.py plain /tmp/plain-hard

      # C: the same samples as Harbor tasks (oracle agent: runs a fixed script, no LLM).
      - name: Install Harbor
        run: |
          SECONDS=0
          pip install --quiet "harbor==0.23.0"
          echo "harbor install: ${SECONDS}s"; pip list 2>/dev/null | wc -l

      - name: Harbor - each sample as a task (oracle agent, no-network)
        run: |
          SECONDS=0
          mkdir -p /tmp/htasks
          for s in evals/sandbox/samples/*/; do
            bash evals/sandbox/harbor/make_task.sh "$s" "/tmp/htasks/$(basename "$s")"
          done
          harbor run -p /tmp/htasks -a oracle -e docker -o /tmp/hjobs -n 1 -y 2>&1 | tail -40
          echo "harbor run: ${SECONDS}s"
          python evals/sandbox/report.py harbor /tmp/hjobs

      - name: Upload traces and Harbor jobs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            /tmp/plain-naive
            /tmp/plain-hard
            /tmp/hjobs
