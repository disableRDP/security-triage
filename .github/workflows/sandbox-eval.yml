name: sandbox-eval

# Evaluation of dynamic (sandboxed) execution for a possible v2. Manual only;
# never part of master's CI. See evals/sandbox/README.md for results.
# Every sample is a harmless canary or an isolation probe: they touch only fake
# credential files and 198.51.100.7 (TEST-NET-2, RFC 5737, never routable).
on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          docker version --format 'docker server {{.Server.Version}}'
          uname -r
          cat /proc/sys/kernel/yama/ptrace_scope || true

      - name: Build sandbox image
        run: |
          SECONDS=0
          docker build -t triage-sandbox -f evals/sandbox/image/Dockerfile evals/sandbox
          echo "image build: ${SECONDS}s"

      # A listener on the HOST. A sandbox that can reach it can reach the machine it runs on.
      - name: Start host-side listener on :8099
        run: |
          nohup python3 -m http.server 8099 --bind 0.0.0.0 >/dev/null 2>&1 &
          sleep 2; curl -s -o /dev/null -w "host listener reachable from host: %{http_code}\n" http://127.0.0.1:8099/

      - name: Plain docker run, four network modes
        run: |
          docker network create --internal sbx-internal >/dev/null
          run_mode () {   # run_mode <label> <extra docker flags...>
            label="$1"; shift; SECONDS=0
            for s in evals/sandbox/samples/*/; do
              name="$(basename "$s")"; out="/tmp/plain-$label/$name"
              mkdir -p "$out"; chmod 777 "$out"
              docker run --rm "$@" --cap-drop ALL --security-opt no-new-privileges \
                --pids-limit 128 --memory 512m --cpus 1 \
                -v "$PWD/$s:/skill:ro" -v "$out:/out" \
                triage-sandbox /monitor/run_under_strace.sh /skill /out 20 > /dev/null
            done
            echo "mode $label: ${SECONDS}s"
          }
          run_mode none      --network none
          run_mode internal  --network sbx-internal
          run_mode bridge    --network bridge
          echo; echo "=== containment probe, by network mode (bridge is the control: it SHOULD reach out) ==="
          for m in none internal bridge; do
            echo "--- $m ---"; cat /tmp/plain-$m/probe-egress/probe.py.stdout
          done
          echo; echo "=== verdicts, mode: none ==="; python evals/sandbox/report.py plain /tmp/plain-none
          echo; echo "=== verdicts, mode: internal ==="; python evals/sandbox/report.py plain /tmp/plain-internal

      - name: Diagnose privilege drop (did the traced script really stop being root?)
        run: |
          flags="--rm --user 0 --cap-drop ALL --cap-add SETUID --cap-add SETGID --cap-add SYS_PTRACE --network none"
          echo "strace -u sandbox:"
          docker run $flags triage-sandbox strace -u sandbox -o /dev/null id
          echo "setpriv wrapper under a root tracer:"
          docker run $flags triage-sandbox strace -f -o /dev/null setpriv --reuid=sandbox --regid=sandbox --init-groups --reset-env id

      # tracer as root, script drops to an unprivileged user; read-only rootfs.
      - name: Plain docker run - hardened (tracer isolated from the script)
        run: |
          SECONDS=0
          for s in evals/sandbox/samples/*/; do
            name="$(basename "$s")"; out="/tmp/plain-hard/$name"
            sudo install -d -o root -g root -m 755 "$out"
            docker run --rm --network sbx-internal --user 0 \
              --cap-drop ALL --cap-add SETUID --cap-add SETGID --cap-add SYS_PTRACE \
              --security-opt no-new-privileges --read-only \
              --tmpfs /tmp:rw,mode=1777 --tmpfs /workspace:rw,mode=1777 \
              --pids-limit 128 --memory 512m --cpus 1 -e RUN_AS=sandbox \
              -v "$PWD/$s:/skill:ro" -v "$out:/out" \
              triage-sandbox /monitor/run_under_strace.sh /skill /out 20 > /dev/null
          done
          echo "hardened: ${SECONDS}s"
          sudo chmod -R a+rX /tmp/plain-hard
          echo; echo "=== verdicts, hardened ==="; python evals/sandbox/report.py plain /tmp/plain-hard
          echo; echo "=== tamper debug: security-relevant lines that survived ==="
          for m in none hard; do
            echo "--- tamper, mode $m ---"
            grep -E "credentials|connect\(.*inet_addr|/out/|execve\(\"/usr/bin/curl" /tmp/plain-$m/evasive-tamper/tamper.sh.trace | grep -v nscd | cut -c1-170 | head -8
            ls -la /tmp/plain-$m/evasive-tamper/ | sed -n '2,6p'
          done

      - name: Install Harbor
        run: |
          SECONDS=0
          pip install --quiet "harbor==0.23.0"
          echo "harbor install: ${SECONDS}s"

      - name: Harbor - each sample as a task (oracle agent, no-network)
        run: |
          SECONDS=0
          mkdir -p /tmp/htasks
          for s in evals/sandbox/samples/*/; do
            bash evals/sandbox/harbor/make_task.sh "$s" "/tmp/htasks/$(basename "$s")"
          done
          harbor run -p /tmp/htasks -a oracle -e docker -o /tmp/hjobs -n 1 -y 2>&1 | tail -12
          echo "harbor run: ${SECONDS}s"
          echo; echo "=== verdicts, Harbor ==="; python evals/sandbox/report.py harbor /tmp/hjobs
          echo; echo "=== containment probe, Harbor no-network ==="
          cat /tmp/hjobs/*/probe-egress__*/verifier/probe.py.stdout 2>/dev/null || echo "(no probe stdout)"

      - name: Harbor diagnostics - is egress control actually enforced?
        run: |
          python - <<'PY'
          from harbor.environments.docker.docker import DockerEnvironment as D
          print("kernel support check returns:", D._egress_control_kernel_support())
          PY
          docker run --rm alpine:3.23.4 sh -c 'ls -la /proc/config.gz 2>&1; echo "exit $?"' || true
          mkdir -p /tmp/diag
          bash evals/sandbox/harbor/make_task.sh evals/sandbox/samples/probe-egress /tmp/diag/probe
          { echo '#!/bin/bash'; echo '/monitor/run_under_strace.sh /skill /tmp/strace 20'; echo 'sleep 45'; } > /tmp/diag/probe/solution/solve.sh
          (harbor run -p /tmp/diag/probe -a oracle -e docker -o /tmp/diagjobs -y > /tmp/diag.log 2>&1 &)
          for i in $(seq 1 60); do
            sleep 3
            docker ps --format '{{.Names}}' | grep -q main && break
          done
          sleep 20
          echo "== containers =="; docker ps -a --format '{{.Names}} | {{.Image}} | {{.Status}}'
          echo "== networks =="; docker network ls
          for c in $(docker ps --format '{{.Names}}'); do
            echo "== $c =="; docker inspect -f 'netmode={{.HostConfig.NetworkMode}} capadd={{.HostConfig.CapAdd}}' "$c"
          done
          sidecar="$(docker ps --format '{{.Names}}' | grep -i egress | head -1)"
          echo "sidecar container: ${sidecar:-NONE FOUND}"
          [ -n "$sidecar" ] && docker exec "$sidecar" sh -c 'echo "-- nft --"; nft list table inet gost_egress 2>&1; echo "-- processes --"; ps aux 2>&1 | head -12' || true
          main="$(docker ps --format '{{.Names}}' | grep main | head -1)"
          echo "== inside main =="; docker exec "$main" sh -c 'cat /proc/net/route; echo ---; cat /etc/resolv.conf' 2>&1 | head -14
          while pgrep -f "harbor run" >/dev/null; do sleep 3; done
          echo "== harbor probe result =="; cat /tmp/diagjobs/*/probe-egress__*/verifier/probe.py.stdout 2>/dev/null || echo "(none)"
          tail -5 /tmp/diag.log

      - name: Harbor - hardened tasks (own compose overlay, empty network, root tracer)
        run: |
          SECONDS=0
          mkdir -p /tmp/htasks-hard
          for s in evals/sandbox/samples/*/; do
            HARDEN=1 bash evals/sandbox/harbor/make_task.sh "$s" "/tmp/htasks-hard/$(basename "$s")"
          done
          harbor run -p /tmp/htasks-hard -a oracle -e docker -o /tmp/hjobs-hard -n 1 -y 2>&1 | tail -6
          echo "harbor hardened run: ${SECONDS}s"
          echo; echo "=== verdicts, Harbor hardened ==="; python evals/sandbox/report.py harbor /tmp/hjobs-hard
          echo; echo "=== containment probe, Harbor hardened ==="
          cat /tmp/hjobs-hard/*/probe-egress__*/verifier/probe.py.stdout 2>/dev/null || echo "(no probe stdout)"

      - name: Upload traces and Harbor jobs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            /tmp/plain-none
            /tmp/plain-internal
            /tmp/plain-bridge
            /tmp/plain-hard
            /tmp/hjobs
            /tmp/hjobs-hard
