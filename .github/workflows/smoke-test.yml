name: smoke-test

on:
  push:
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-based scanners (semgrep, skillspector)
        shell: bash
        run: |
          pip install semgrep
          pip install "git+https://github.com/NVIDIA/skillspector.git"

      - name: Install gitleaks
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: gitleaks/gitleaks

      # osv-scanner ships bare per-platform binaries (no archive), which
      # jaxxstorm/action-install-gh-release's asset-matching could not
      # resolve ("Could not find asset for latest") on any of the three
      # runners when first tried - confirmed by actually running this
      # workflow, not assumed. Downloading explicitly instead.
      - name: Install osv-scanner
        shell: bash
        run: |
          set -e
          case "${{ matrix.os }}" in
            ubuntu-latest) asset="osv-scanner_linux_amd64"; dest="osv-scanner" ;;
            macos-latest) asset="osv-scanner_darwin_amd64"; dest="osv-scanner" ;;
            windows-latest) asset="osv-scanner_windows_amd64.exe"; dest="osv-scanner.exe" ;;
          esac
          curl -sL -o "$RUNNER_TEMP/$dest" "https://github.com/google/osv-scanner/releases/latest/download/$asset"
          chmod +x "$RUNNER_TEMP/$dest"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Tier 5 domain-check tests (offline, fake feeds and fake RDAP)
        shell: bash
        run: python tests/test_domain_check.py

      - name: Syntax-check all scripts
        shell: bash
        run: |
          set -e
          for f in scripts/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done

      # Regression gate: this is the exact check that would have caught
      # both real bugs found during manual testing (skillspector's
      # --output vs --format flag, osv-scanner's exit-128 "no manifest"
      # case misclassified as a tool error) if it had existed then.
      - name: Smoke test - self-scan (no package manifest in this repo)
        shell: bash
        run: |
          set -e
          staged="$(bash scripts/stage.sh "$PWD")"
          out="$(mktemp -d)"
          bash scripts/triage.sh "$staged" "$out"
          echo "--- manifest ---"
          cat "$out/manifest.json"
          python - "$out/manifest.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          bad = [t for t in d["tiers"] if t["status"] == "ran-with-errors"]
          if bad:
              print("UNEXPECTED tool errors:", json.dumps(bad, indent=2))
              sys.exit(1)
          print("OK: no unexpected tool errors")
          PY

      - name: Smoke test - vulnerable fixture (osv-scanner findings path)
        shell: bash
        run: |
          set -e
          fixture="$(mktemp -d)"
          echo "django==1.0" > "$fixture/requirements.txt"
          out="$(mktemp -d)"
          bash scripts/triage.sh "$fixture" "$out"
          echo "--- manifest ---"
          cat "$out/manifest.json"
          python - "$out/manifest.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          osv = next(t for t in d["tiers"] if t["tool"] == "osv-scanner")
          assert osv["status"] == "ran", f"expected osv-scanner to run, got: {osv}"
          assert "exit 1" in osv["detail"], f"expected vulnerabilities-found (exit 1), got: {osv}"
          print("OK: osv-scanner found the known-vulnerable fixture dependency")
          PY

      - name: Smoke test - registry reference staging
        shell: bash
        run: |
          set -e
          result="$(bash scripts/stage.sh "npm:left-pad")"
          [[ "$result" == "REGISTRY:npm:left-pad" ]] || { echo "FAIL: got '$result'"; exit 1; }
          echo "OK: registry reference staged correctly"

      # Regression test for the hardening in triage.sh: a hostile target must
      # not be able to hide its own findings. Each payload below is hidden by
      # a different mechanism; with the pre-hardening scanner commands only 6
      # of these 13 were reported. This also fails if a future Semgrep drops
      # the experimental --x-ignore-semgrepignore-files flag (the run would
      # error instead of silently under-scanning). The token is assembled at
      # runtime from a split literal so no secret-shaped string is committed.
      - name: Hostile-fixture test - target-supplied suppression must not hide findings
        shell: bash
        run: |
          set -e
          root="$(mktemp -d)"
          fix="$root/hostile"
          mkdir -p "$fix/ignored_dir" "$fix/plain_dir" "$fix/cfg_dir"
          ( cd "$fix" && git init -q )
          tok="ghp""_Zq8Xk2Lm9Pv4Rt7Ws1Yd6Fn3Hc5Jb0GaEiOu"
          pay='eval(process.argv[2]);'
          printf 'ignored_dir/\n' > "$fix/.gitignore"
          printf 'sg_ignored.js\n' > "$fix/.semgrepignore"
          cat > "$fix/.gitleaks.toml" <<'EOF'
          [extend]
          useDefault = true
          [allowlist]
          paths = ['''secret_cfg\.txt''']
          EOF
          cat > "$fix/cfg_dir/osv-scanner.toml" <<'EOF'
          [[PackageOverrides]]
          name = "django"
          ecosystem = "PyPI"
          ignore = true
          reason = "hostile"
          EOF
          echo "token=$tok" > "$fix/secret_plain.txt"
          echo "token=$tok # gitleaks:allow" > "$fix/secret_allow.txt"
          echo "token=$tok" > "$fix/secret_cfg.txt"
          echo "$pay" > "$fix/plain.js"
          echo "$pay // nosemgrep" > "$fix/nosem.js"
          echo "$pay" > "$fix/sg_ignored.js"
          { printf '// '; head -c 1100000 /dev/zero | tr '\0' 'x'; printf '\n'; echo "$pay"; } > "$fix/big.js"
          for d in plain_dir ignored_dir cfg_dir; do echo "django==1.0" > "$fix/$d/requirements.txt"; done
          bash scripts/triage.sh "$fix" "$root/out" >/dev/null
          python - "$root/out" <<'PY'
          import json, sys
          out = sys.argv[1]
          def rel(p): return p.replace("\\", "/").split("/hostile/", 1)[1]
          load = lambda n: json.load(open(out + "/" + n, encoding="utf-8"))
          gl = {rel(f["File"]) for f in load("tier0_gitleaks.json")}
          osv = {rel(r["source"]["path"]) for r in load("tier0_osv.json").get("results", [])
                 if any(p.get("vulnerabilities") for p in r.get("packages", []))}
          sg = {rel(r["path"]) for r in load("tier3_semgrep.json").get("results", []) if "eval-detected" in r["check_id"]}
          want = {
              "gitleaks": (gl, {"secret_plain.txt", "secret_allow.txt", "secret_cfg.txt"}),
              "osv-scanner": (osv, {"plain_dir/requirements.txt", "ignored_dir/requirements.txt", "cfg_dir/requirements.txt"}),
              "semgrep": (sg, {"plain.js", "nosem.js", "sg_ignored.js", "big.js"}),
          }
          bad = {t: sorted(w - got) for t, (got, w) in want.items() if w - got}
          if bad:
              print("HIDDEN FROM SCANNER (hostile target suppressed its own findings):", bad)
              sys.exit(1)
          print("OK: all 10 hidden payloads reported")
          PY
          lockless="$(mktemp -d)"
          echo '{"name":"x","dependencies":{"lodash":"4.17.15"}}' > "$lockless/package.json"
          bash scripts/triage.sh "$lockless" "$root/out2" >/dev/null
          python - "$root/out2/manifest.json" <<'PY'
          import json, sys
          osv = next(t for t in json.load(open(sys.argv[1], encoding="utf-8"))["tiers"] if t["tool"] == "osv-scanner")
          assert osv["status"] == "partial" and "NO CVE COVERAGE" in osv["detail"], f"lockfile-less manifest must not read as clean: {osv}"
          print("OK: manifest without a lockfile is reported as partial coverage, not clean")
          PY

      # Files removed from the scanned tree (antivirus, failed checkout)
      # must not silently shrink coverage: on a real malicious-skill sample,
      # Defender deleted the 20 most blatant skills and the pipeline simply
      # never saw them. A tracked file missing at the end of a scan has to
      # surface as partial coverage.
      - name: Integrity test - a deleted tracked file must be reported as partial
        shell: bash
        run: |
          set -e
          root="$(mktemp -d)"
          repo="$root/repo"
          mkdir -p "$repo"
          ( cd "$repo" && git init -q && echo hello > a.txt && echo world > b.txt \
            && git add . && git -c user.email=ci@example.com -c user.name=ci commit -qm init )
          bash scripts/triage.sh "$repo" "$root/intact" >/dev/null
          rm -f "$repo/b.txt"
          bash scripts/triage.sh "$repo" "$root/missing" >/dev/null
          python - "$root/intact/manifest.json" "$root/missing/manifest.json" <<'PY'
          import json, sys
          get = lambda p: next(t for t in json.load(open(p, encoding="utf-8"))["tiers"] if t["tool"] == "integrity")
          intact, missing = get(sys.argv[1]), get(sys.argv[2])
          assert intact["status"] == "ran", f"intact tree must pass: {intact}"
          assert missing["status"] == "partial" and "b.txt" in missing["detail"], f"missing file must be reported: {missing}"
          print("OK: intact tree passes; a deleted tracked file is reported as partial")
          PY
